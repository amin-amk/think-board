  <path d="M11 16H18" stroke="#818CF8" stroke-width="2" stroke-linecap="round" />
  
  <!-- نقطه تأکید بنفش/اندگو -->
  <circle cx="20" cy="20" r="2" fill="#6366F1" />
</svg>
